name: African rollout starter audit
on:
  workflow_dispatch:
  push:
    branches: [codex/world-foundation]
    paths:
      - 'src/game/cities/**'
      - 'world/playable-africa-rollout/**'
      - 'scripts/world/build-africa-starters.py'
      - 'world/tooling/test_africa_starter_selection.py'
      - 'world/tooling/atomic_starter_publication.py'
      - 'world/tooling/test_atomic_starter_publication.py'
      - 'world/tooling/run_africa_starters.py'
      - 'world/tooling/test_run_africa_starters.py'
      - 'world/tooling/stage-checkpoint-policy.mjs'
      - 'world/tooling/stage-checkpoint-policy.test.mjs'
      - 'world/tooling/serve-sealed-africa.mjs'
      - 'world/tooling/stage-control-file.mjs'
      - 'world/tooling/stage-control-file.test.mjs'
      - 'world/tooling/sealed-africa-coverage.mjs'
      - 'world/tooling/sealed-africa-coverage.test.mjs'
      - 'world/tooling/verify-sealed-africa.mjs'
      - 'world/tooling/sealed-admin-rate-policy.mjs'
      - 'world/tooling/sealed-admin-rate-policy.test.mjs'
      - 'scripts/world/build-playable-africa.py'
      - 'scripts/world/verify-playable-destination.ts'
      - '.github/workflows/africa-rollout-audit-ci.yml'
permissions:
  contents: read
jobs:
  source-and-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Pinned settlement selection and compact city generation
        run: python3 -B -m unittest world.tooling.test_africa_starter_selection -v
      - name: Serial runner and interrupted owned publication
        run: python3 -B -m unittest world.tooling.test_run_africa_starters world.tooling.test_atomic_starter_publication -v
      - name: Retained stage source upgrade policy
        env:
          NODE_OPTIONS: --max-old-space-size=128
        run: node --test --test-concurrency=1 world/tooling/stage-checkpoint-policy.test.mjs world/tooling/stage-control-file.test.mjs world/tooling/sealed-africa-coverage.test.mjs world/tooling/sealed-admin-rate-policy.test.mjs
      - name: Tracked generated assets and source identities
        run: |
          python3 - <<'PYTHON'
          import json, re, subprocess
          from pathlib import Path
          receipts = sorted(Path('world/playable-africa-rollout/receipts').glob('*.json'))
          if not receipts:
              raise SystemExit('No authored rollout receipts')
          cities = []
          for path in receipts:
              row = json.loads(path.read_text())
              if not re.fullmatch(r'[A-Z]{2}', row['countryIso2']) or not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', row['cityId']):
                  raise SystemExit('Invalid receipt identity: ' + str(path))
              if path.stem != row['cityId'] or row['cityId'] in cities:
                  raise SystemExit('Changed or duplicated receipt identity: ' + str(path))
              command = ['python3', 'scripts/world/build-africa-starters.py', '--country', row['countryIso2'], '--check-assets']
              selection = row.get('jubaSelection')
              if selection is not None:
                  command.extend(['--juba-selection', selection['packetPath'], '--juba-selection-sha256', selection['packetSha256']])
              subprocess.run(command, check=True)
              cities.append(row['cityId'])
          Path('rollout-city-list.txt').write_text('\n'.join(cities) + '\n')
          PYTHON
      - name: Verify each city before the next
        env:
          NODE_OPTIONS: --max-old-space-size=512
        run: |
          while IFS= read -r city
          do
            node --experimental-strip-types scripts/world/verify-playable-destination.ts "$city"
          done < rollout-city-list.txt
      - name: Strict city and verifier types, one city at a time
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          while IFS= read -r city
          do
            node node_modules/typescript/bin/tsc --ignoreConfig --noEmit --allowImportingTsExtensions --module nodenext --moduleResolution nodenext --target es2023 --strict --noUncheckedIndexedAccess --skipLibCheck --types node scripts/world/verify-playable-destination.ts src/game/cities/"$city"/*.ts
          done < rollout-city-list.txt
