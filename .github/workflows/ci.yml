name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_checks:
        description: Run the full Node 22, Node 24, and Worker checks
        required: true
        type: boolean
        default: false
      focused_living_world:
        description: Synthetic living-world HTTP and Worker evidence only; does not satisfy release CI
        required: false
        type: boolean
        default: false
      startup_report:
        description: Observe the exact fast build startup graph outside dist; no release gate exemption
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/guard-joinallworld-package.test.mjs

  typecheck-fast:
    name: ${{ inputs.focused_living_world && 'evidence-only - typecheck omitted' || 'typecheck-fast' }}
    if: github.event_name != 'workflow_dispatch' || (!inputs.full_checks && !inputs.focused_living_world)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  build-and-smoke-fast:
    name: ${{ inputs.focused_living_world && 'evidence-only - build and smoke omitted' || 'build-and-smoke-fast' }}
    if: github.event_name != 'workflow_dispatch' || (!inputs.full_checks && !inputs.focused_living_world)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build with optional read-only startup observer
        run: |
          if [ '${{ inputs.startup_report }}' = 'true' ]; then
            npm run -s prebuild
            node --experimental-strip-types scripts/living-world-startup-report.ts
          else
            npm run build
          fi
      - name: Retain exact startup graph
        if: always() && inputs.startup_report
        uses: actions/upload-artifact@v4
        with:
          name: living-world-startup-${{ github.sha }}
          path: .tmp/living-world-startup-report.json
          if-no-files-found: error
          retention-days: 3
      - run: npm run size:download
      - run: npm run test:smoke

  full:
    name: ${{ inputs.focused_living_world && 'evidence-only - full omitted' || format('full ({0})', matrix.node) }}
    if: github.event_name == 'workflow_dispatch' && inputs.full_checks && !inputs.focused_living_world
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # The build comes first: the tests that read dist/ (bundle budgets, the served files) skip themselves without it.
      - run: npm run build
      - run: npm run size:download
      - run: npm test
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix deploy/tooling
      - run: npm run test:edge

  # Focused evidence cannot replace budget/full/staging/release acceptance.
  focused-living-world:
    if: github.event_name == 'workflow_dispatch' && inputs.focused_living_world
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - name: Refuse ambiguous evidence mode
        if: inputs.full_checks || inputs.startup_report
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Programme authority, continuity and scoped regression checks
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          server/living-world/rental-service.test.ts
          server/living-world/privacy.test.ts
          server/living-world/account-lifecycle.test.ts
          src/game/living-world/clerk.test.ts
          server/living-world/clerk-service.test.ts
          server/living-world/clerk-privacy.test.ts
          src/app/features/living-world/clerkReply.test.ts
          src/client.test.ts
          src/campus/unilag/client.integration.test.ts
          server/new-player.test.ts
          server/two-players.test.ts
          src/game/economy.test.ts
          src/game/browser-profile.test.ts
          src/game/character.test.ts
          src/game/cities/legacyLife.test.ts
          src/game/cities/liveBuildLife.test.ts
          src/scene/movement.test.ts
          src/venue-world.test.ts
          src/app/features/living-world/rentalReply.test.ts
          src/game/living-world/parcel.test.ts
          src/game/living-world/fleet.test.ts
          src/game/living-world/vehicle-clearance.test.ts
          scripts/living-world-startup-report.test.ts
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix deploy/tooling
      - name: Actual Worker SQLite permission, account and restart checks
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          deploy/living-world-rental.edge.test.ts
          deploy/living-world-account.edge.test.ts
          deploy/living-world-restart.edge.test.ts
          deploy/living-world-clerk.edge.test.ts
