name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_checks:
        description: Run the full Node 22, Node 24, and Worker checks
        required: true
        type: boolean
        default: false
      ui_checks:
        description: Run published app UI regressions alongside canonical fast checks; full release checks still required
        required: false
        type: boolean
        default: false
      focused_living_world:
        description: Synthetic living-world HTTP and Worker evidence only; does not satisfy release CI
        required: false
        type: boolean
        default: false
      startup_report:
        description: Observe the exact fast build startup graph outside dist; no release gate exemption
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --experimental-strip-types --test scripts/guard-joinallworld-package.test.mjs scripts/run-node-suite.test.ts

  typecheck-fast:
    name: ${{ inputs.focused_living_world && 'evidence-only - typecheck omitted' || 'typecheck-fast' }}
    if: github.event_name != 'workflow_dispatch' || (!inputs.full_checks && !inputs.focused_living_world)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  build-and-smoke-fast:
    name: ${{ inputs.focused_living_world && 'evidence-only - build and smoke omitted' || 'build-and-smoke-fast' }}
    if: github.event_name != 'workflow_dispatch' || (!inputs.full_checks && !inputs.focused_living_world)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build with optional read-only startup observer
        run: |
          if [ '${{ inputs.startup_report }}' = 'true' ]; then
            npm run -s prebuild
            node --experimental-strip-types scripts/living-world-startup-report.ts
          else
            npm run build
          fi
      - name: Retain exact startup graph
        if: always() && inputs.startup_report
        uses: actions/upload-artifact@v4
        with:
          name: living-world-startup-${{ github.sha }}
          path: .tmp/living-world-startup-report.json
          if-no-files-found: error
          retention-days: 3
      - run: npm run size:download
      - run: npm run test:smoke

  ui-regressions:
    if: github.event_name == 'workflow_dispatch' && inputs.ui_checks && !inputs.focused_living_world && !inputs.full_checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Existing app UI model and component checks
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          src/app/components.test.ts
          src/app/features/civic/civicComponents.test.ts
          src/app/features/companion/companion.test.ts
          src/app/features/companion/registry.test.ts
          src/app/features/models.test.ts
          src/app/features/support/supportPanel.test.ts
          src/app/features/money/statementHistory.test.ts
          src/app/features/business/business.test.ts
          src/app/features/business/businessComponents.test.ts
          src/app/features/visit/visit.test.ts
          src/app/features/growth/growth.test.ts
          src/app/features/growth/components.test.ts
          src/app/features/politics/politicsModel.test.ts
          src/app/features/politics/politicsComponents.test.ts
          src/app/features/messages/notifyModel.test.ts
          src/app/features/messages/messagesComponents.test.ts
          src/app/features/sim/soundSettingsModel.test.ts
          src/app/features/start/creatorModel.test.ts
          src/app/features/start/startModels.test.ts
          src/app/features/start/startComponents.test.ts
          src/app/features/tables/tablesModel.test.ts
          src/app/features/tables/tablesComponents.test.ts
          src/app/features/tables/chessModel.test.ts
          src/app/features/tables/chessBoard.test.ts
          src/app/features/tables/weaveModel.test.ts
          src/app/features/tables/weaveBoard.test.ts
          server/economy/effects.test.ts
          server/recovery-action-intent.test.ts
          server/salt.test.ts
          server/settlement-clock.test.ts
          src/app/features/commerceStatementIdentity.test.ts
          src/app/features/money/statementModel.test.ts
          src/app/features/landing/landing.test.ts
          src/app/features/landing/landingLoader.test.ts
          src/quick-start/model.test.ts
          src/game/living-world/vehicle-clearance.test.ts
          src/game/living-world/depot-site.test.ts
          src/game/living-world/depot-motion.test.ts
          src/street/overlay.test.ts
          src/street/overlay-window.test.ts
          src/app/features/living-world/depotOverlay.test.ts
          src/app/features/living-world/practiceIdentity.test.ts
          src/app/features/locate/locate.test.ts
          src/app/features/panelsA.test.ts
          src/app/features/travel/travelComponents.test.ts
          src/app/features/travel/travelLevels.test.ts
          src/ui/phone/phone.test.ts
          src/campus/unilag/content.test.ts
          src/campus/unilag/integration.test.ts
          src/campus/unilag/shuttle.test.ts
          src/campus/unilag/shuttle-clearance.test.ts
          src/campus/unilag/scene.test.ts
          src/campus/unilag/walk.test.ts

      - name: Active learning HTTP, privacy and lifecycle checks
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          src/game/living-world/justice-practice.test.ts
          server/living-world/justice-practice-service.test.ts
          server/living-world/justice-privacy.test.ts
          server/living-world/account-lifecycle.test.ts
          src/app/features/living-world/justiceReply.test.ts
          src/app/features/living-world/justiceIdentity.test.ts
          src/campus/unilag/assessment-practice.test.ts
          server/living-world/assessment-service.test.ts
          server/living-world/assessment-privacy.test.ts
          src/app/features/campus/assessmentReply.test.ts
          src/app/features/campus/assessmentIdentity.test.ts
          src/campus/unilag/student.test.ts
          server/chess-table.test.ts

      - name: Existing shopping, housing and career checks
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          --test-name-pattern='groceries|Groceries:|Health:|jobs:|Jobs:|career:|Career:|Houses and Cars:'
          src/app/features/panelsA.test.ts

      - name: City validation and actual pagination cost evidence
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          scripts/city/build-city.test.ts
          src/game/cities/allCities.test.ts
          server/founder.test.ts

      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix deploy/tooling
      - name: Existing Worker host and timed-action checks
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          deploy/trip-skip.edge.test.ts deploy/live.edge.test.ts deploy/living-world-learning.edge.test.ts

  full:
    name: ${{ inputs.focused_living_world && 'evidence-only - full omitted' || format('full-source ({0})', matrix.node) }}
    if: github.event_name == 'workflow_dispatch' && inputs.full_checks && !inputs.focused_living_world
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STUCK_DIAGNOSTICS: '1'
      NODE_OPTIONS: --max-old-space-size=1536
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
        # Preserve the previously passing remote compiler settings. The game/test heap cap
        # below is not the compiler's existing limit; local compilers still require their slot.
        env:
          NODE_OPTIONS: ''
      # The build comes first: the tests that read dist/ (bundle budgets, the served files) skip themselves without it.
      - run: npm run build
      - run: npm run size:download
      - run: npm run -s pretest
      - name: Complete canonical source and scripts partition
        run: node --experimental-strip-types scripts/run-node-suite.ts source

  # All waves are mandatory. Separate jobs preserve coverage under the existing 25-minute cap.
  # Job-level dependencies prevent six simultaneous Node/Worker jobs.
  full-server:
    needs: full
    if: github.event_name == 'workflow_dispatch' && inputs.full_checks && !inputs.focused_living_world
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Server bundle/served-file tests need the same exact built dist, never a missing-build skip.
      - run: npm run build
      - run: npm run size:download
      - run: npm run -s pretest
      - name: Complete canonical server partition
        run: node --experimental-strip-types scripts/run-node-suite.ts server

  full-worker:
    needs: full-server
    if: github.event_name == 'workflow_dispatch' && inputs.full_checks && !inputs.focused_living_world
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      STUCK_DIAGNOSTICS: '1'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run size:download
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix deploy/tooling
      - run: npm run test:edge

  # Focused evidence cannot replace budget/full/staging/release acceptance.
  focused-living-world:
    if: github.event_name == 'workflow_dispatch' && inputs.focused_living_world
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      STUCK_DIAGNOSTICS: '1'
    steps:
      - name: Refuse ambiguous evidence mode
        if: inputs.full_checks || inputs.startup_report || inputs.ui_checks
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile typed sources for scoped fixture evidence
        run: npm run typecheck
        env:
          NODE_OPTIONS: ''
      - name: Programme authority, continuity and scoped regression checks
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          server/living-world/rental-service.test.ts
          server/living-world/npc-inventory.test.ts
          server/living-world/restock-service.test.ts
          server/living-world/restock-wage.test.ts
          server/living-world/restock-privacy.test.ts
          server/living-world/restock-account.test.ts
          server/living-world/privacy.test.ts
          server/living-world/account-lifecycle.test.ts
          src/game/living-world/clerk.test.ts
          server/living-world/clerk-service.test.ts
          server/living-world/clerk-privacy.test.ts
          src/app/features/living-world/clerkReply.test.ts
          src/client.test.ts
          src/campus/unilag/client.integration.test.ts
          server/new-player.test.ts
          server/two-players.test.ts
          src/game/economy.test.ts
          src/game/browser-profile.test.ts
          src/game/character.test.ts
          src/game/cities/legacyLife.test.ts
          src/game/cities/liveBuildLife.test.ts
          src/scene/movement.test.ts
          src/scene/city-scenes.test.ts
          src/venue-world.test.ts
          server/recovery-receipt-isolation.test.ts
          server/settlement-clock.test.ts
          src/app/features/commerceStatementIdentity.test.ts
          src/app/features/money/statementModel.test.ts
          src/app/features/landing/landing.test.ts
          src/app/features/landing/landingLoader.test.ts
          src/quick-start/model.test.ts
          src/app/features/social/socialComponents.test.ts
          src/ui/npc-mark.test.ts
          src/app/features/campus/campusWalkability.test.ts
          src/app/features/campus/campus.test.ts
          src/app/features/living-world/rentalReply.test.ts
          src/game/living-world/parcel.test.ts
          src/game/living-world/fleet.test.ts
          src/game/living-world/vehicle-clearance.test.ts
          scripts/living-world-startup-report.test.ts
          src/game/living-world/vehicle-boarding.test.ts
          src/game/living-world/sedan-contact.test.ts
          src/models/vehicles/sedan-interior.test.ts
          src/models/vehicles/vehicles.test.ts
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix deploy/tooling
      - name: Actual Worker SQLite permission, account, restart and scoped startup diagnostics
        run: >-
          node --experimental-strip-types --test --test-concurrency=1
          deploy/living-world-rental.edge.test.ts
          deploy/living-world-account.edge.test.ts
          deploy/living-world-restart.edge.test.ts
          deploy/living-world-clerk.edge.test.ts
          deploy/sqlite-entries.test.ts
          deploy/business.edge.test.ts
          deploy/words.edge.test.ts
