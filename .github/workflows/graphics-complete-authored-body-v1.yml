name: Complete authored human visible experiment
on:
  push:
    branches: [codex/graphics-complete-authored-body-v18]
permissions:
  contents: read
jobs:
  character:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Prepare pinned complete human and retained identity shapes
        run: |
          python3 evidence/graphics-loop/authored-complete-body-v1/download-source.py
          python3 evidence/graphics-loop/authored-character-spike-v1/retain-morphs.py evidence/graphics-loop/authored-character-spike-v1/parametric-base.glb evidence/graphics-loop/authored-character-spike-v1/parametric-base-expressive.glb
      - name: Bake pinned authored facial units
        run: node --max-old-space-size=128 evidence/graphics-loop/authored-complete-body-v1/bake-authored-expressions.mjs
      - name: Check complete character TypeScript
        run: node --max-old-space-size=768 node_modules/typescript/bin/tsc --noEmit --pretty false -p evidence/graphics-loop/authored-complete-body-v1/typecheck.json
      - name: Check authored rig and resource ownership
        run: |
          node --max-old-space-size=128 evidence/graphics-loop/authored-complete-body-v1/rig-check.mjs > /tmp/rig-check.log
          node --max-old-space-size=32 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/native-pose-check.mjs > /tmp/native-pose-check.log
          node --max-old-space-size=64 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/native-actions-check.mjs > /tmp/native-actions-check.log
          node --max-old-space-size=128 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/clothing-palette-check.mjs
          node --max-old-space-size=64 evidence/graphics-loop/authored-complete-body-v1/eye-material-check.mjs
          python3 evidence/graphics-loop/authored-complete-body-v1/authored-clothing/test_export.py
          node --max-old-space-size=32 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/authored-presentation-check.mjs
      - name: Check native hands footwear skin and hair palette
        run: |
          node --max-old-space-size=48 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/native-hand-pose-check.mjs > /tmp/native-hand-check.log
          node --max-old-space-size=32 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/authored-footwear/presentation-check.mjs > /tmp/footwear-check.log
          node --max-old-space-size=64 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/skin-material-check.mjs
          node --max-old-space-size=128 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/hair-palette-check.mjs
      - name: Check native look bridge and runtime resource contracts
        run: |
          node --max-old-space-size=48 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/authored-look-bridge-check.mjs > /tmp/look-bridge.log
          node --max-old-space-size=48 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/runtime-facade-check.mjs > /tmp/runtime-facade.log
          node --max-old-space-size=24 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/assets-cache-check.mjs
      - name: Check office masks curls and native source clips
        run: |
          OFFICE_CHECK=1 node --max-old-space-size=48 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/authored-presentation-check.mjs
          node --max-old-space-size=48 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/body-mask-union-check.mjs
          node --max-old-space-size=48 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/native-curl-hair-check.mjs
          node --max-old-space-size=48 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/native-clip-solver-check.mjs
      - name: Build complete human comparison
        run: node --max-old-space-size=192 evidence/graphics-loop/authored-complete-body-v1/build-preview.mjs
      - name: Capture real whole-body poses and expressions
        env:
          STATIC_PREVIEW: 1
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          mkdir -p evidence/graphics-loop/authored-complete-body-v1/results
          python3 evidence/graphics-loop/authored-complete-body-v1/bounded-render.py evidence/graphics-loop/authored-complete-body-v1/results/render.log evidence/graphics-loop/authored-complete-body-v1/results/resources.json node evidence/graphics-loop/authored-complete-body-v1/render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-human-${{ github.run_id }}
          path: |
            evidence/graphics-loop/authored-complete-body-v1/results/
            evidence/graphics-loop/authored-character-spike-v1/parametric-base-expressive.report.json
            evidence/graphics-loop/authored-complete-body-v1/rig-check-result.json
            evidence/graphics-loop/authored-complete-body-v1/rig-posture-check-result.json
            evidence/graphics-loop/authored-complete-body-v1/authored-presentation-check-result.json
          if-no-files-found: error
