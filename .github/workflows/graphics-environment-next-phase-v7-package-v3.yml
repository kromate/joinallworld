name: Environment whole-slice v7 diagnostic package (split compiler recipe v3)

on:
  push:
    branches:
      - codex/graphics-environment-next-phase-v7-package-v3

permissions:
  contents: read

concurrency:
  group: environment-whole-slice-v7-package-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Pinned full-host diagnostic package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact review-branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run reviewed serial split compilation and one-copy finalization
        run: python3 evidence/graphics-loop/environment-next-phase-v7/package-recipe-v3/run-bounded-linux-package-v1.py

      - name: Upload v7 source pins, phase receipts, static routes, and bounded result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-whole-slice-v7-package-v3-${{ github.run_id }}
          path: |
            evidence/graphics-loop/environment-next-phase-v7/source-pins-v7.json
            evidence/graphics-loop/environment-next-phase-v7/source-precompile-v7.json
            evidence/graphics-loop/environment-next-phase-v7/source-postcompile-v7.json
            evidence/graphics-loop/environment-next-phase-v7/vendor-v7-record.json
            evidence/graphics-loop/environment-next-phase-v7/addons-v7-record.json
            evidence/graphics-loop/environment-next-phase-v7/app-v7-record.json
            evidence/graphics-loop/environment-next-phase-v7/compile-v7-record.json
            evidence/graphics-loop/environment-next-phase-v7/static-v7/**
            evidence/graphics-loop/environment-next-phase-v7/static-fixture-v7/build-manifest.json
            evidence/graphics-loop/environment-next-phase-v7/finalizer-pins-v7.json
            evidence/graphics-loop/environment-next-phase-v7/finalization-v7-observed.json
            evidence/graphics-loop/environment-next-phase-v7/review-host-v7-staged.json
            evidence/graphics-loop/environment-next-phase-v7/package-recipe-v3/remote-results/**
          if-no-files-found: warn
          retention-days: 14
