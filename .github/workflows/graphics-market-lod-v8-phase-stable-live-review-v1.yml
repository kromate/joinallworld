name: Market LOD v8 phase-stable live-walk review v1

on:
  workflow_dispatch:
  push:
    branches:
      - codex/graphics-market-lod-v8-phase-stable-live-review-v1

permissions:
  actions: read
  contents: read

concurrency:
  group: market-lod-v8-phase-stable-live-review-v1
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact live-motion recipe
        env:
          EXPECTED_REVIEW_MANIFEST_SHA256: b340f210b63acaca6258fee53f6c3feb247099db8e075376e3089c19a9c6e402
        run: node evidence/graphics-loop/crowd-lod-market-v8/phase-stable-diagnostic-v1/remote-gpu-review-v1/verify-source-snapshot.mjs "$EXPECTED_REVIEW_MANIFEST_SHA256"
      - name: Verify package source run branch and commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PACKAGE_RUN_ID: '37897711045'
          EXPECTED_PACKAGE_BRANCH: codex/graphics-market-lod-v8-phase-stable-cpu-review-v1
          EXPECTED_PACKAGE_COMMIT: 3fc49465e8e350b1205e7863b546a1932fe070d8
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_PACKAGE_RUN_ID}")"
          test "$(jq -r .id <<<"$run_json")" = "$EXPECTED_PACKAGE_RUN_ID"
          test "$(jq -r .head_branch <<<"$run_json")" = "$EXPECTED_PACKAGE_BRANCH"
          test "$(jq -r .head_sha <<<"$run_json")" = "$EXPECTED_PACKAGE_COMMIT"
          test "$(jq -r .status <<<"$run_json")" = completed
          test "$(jq -r .conclusion <<<"$run_json")" = success
      - name: Download only the pinned v8 CPU package artifact
        uses: actions/download-artifact@v4
        with:
          name: market-lod-v8-phase-stable-cpu-package-v1-37897711045
          run-id: 37897711045
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: evidence/graphics-loop/crowd-lod-market-v8/phase-stable-diagnostic-v1/remote-gpu-review-v1/downloaded-artifact
      - name: Install exact lockfile dependencies for CDP
        run: npm ci --no-audit --no-fund
      - name: Locate preinstalled runner Google Chrome
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome_path"
          printf 'CHROME_BIN=%s\n' "$chrome_path" >> "$GITHUB_ENV"
          "$chrome_path" --version
      - name: Capture post-pause source before same-phase source/compact comparison
        env:
          EXPECTED_SOURCE_MANIFEST_SHA256: b340f210b63acaca6258fee53f6c3feb247099db8e075376e3089c19a9c6e402
          PACKAGE_RUN_ID: '37897711045'
          PACKAGE_BRANCH: codex/graphics-market-lod-v8-phase-stable-cpu-review-v1
          PACKAGE_COMMIT: 3fc49465e8e350b1205e7863b546a1932fe070d8
        run: python3 evidence/graphics-loop/crowd-lod-market-v8/phase-stable-diagnostic-v1/remote-gpu-review-v1/run-bounded-linux.py
      - name: Preserve review images and receipts even when the diagnostic fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-lod-v8-phase-stable-live-review-v1-${{ github.run_id }}
          path: evidence/graphics-loop/crowd-lod-market-v8/phase-stable-diagnostic-v1/remote-gpu-review-v1/remote-results/**
          if-no-files-found: warn
