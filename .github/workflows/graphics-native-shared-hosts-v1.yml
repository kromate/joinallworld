name: Actual creator venue identity and direct canvas comparison
on:
  push:
    branches: [codex/graphics-native-creator-identity-v1]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Bundle exact game seed through production creator API
        run: node --max-old-space-size=256 evidence/graphics-loop/native-game-adoption-v1/bundle-creator-identity.mjs
      - name: Strict creator fixture types
        if: always()
        run: node --max-old-space-size=1536 node_modules/typescript/bin/tsc --noEmit --pretty false -p evidence/graphics-loop/native-game-adoption-v1/creator-identity.typecheck.json
      - name: Render actual same-seed returned bodies and direct preview canvas
        if: always()
        run: python3 evidence/graphics-loop/native-game-adoption-v1/bounded-render.py /tmp/creator-identity-render.log /tmp/creator-identity-render-receipt.json node evidence/graphics-loop/native-game-adoption-v1/render-creator-identity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-identity-${{ github.run_id }}
          path: |
            evidence/graphics-loop/native-game-adoption-v1/creator-identity-results/
            /tmp/creator-identity-render.log
            /tmp/creator-identity-render-receipt.json
