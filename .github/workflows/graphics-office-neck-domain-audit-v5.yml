name: Office neck-domain audit (bounded, normalized float skin weights v5)
on:
  push:
    branches:
      - codex/graphics-office-neck-domain-audit-v5
permissions:
  contents: read
concurrency:
  group: office-neck-domain-audit-v5-${{ github.ref }}
  cancel-in-progress: false
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SNAPSHOT_SHA256: 260a5dc672ac54b7227e3682790c7ba826537fb125cbf1f607d33a6bbff426ac
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify immutable snapshot before dependency install
        run: node --max-old-space-size=32 evidence/graphics-loop/garment-quality-v1/shoulder-topology-v1/office-source-shell-v3/neck-complement-domain-audit-v1/integration-probe-v5/remote-ci-v5/verify-snapshot.mjs "$EXPECTED_SNAPSHOT_SHA256"
      - name: Verify local imports and asset URLs resolve inside the snapshot
        run: node --max-old-space-size=32 evidence/graphics-loop/garment-quality-v1/shoulder-topology-v1/office-source-shell-v3/neck-complement-domain-audit-v1/integration-probe-v5/remote-ci-v5/verify-import-closure.mjs "$EXPECTED_SNAPSHOT_SHA256"
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Record preinstalled Chrome binary
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          CHROME_REAL="$(readlink -f "$CHROME_BIN")"
          test -n "$CHROME_REAL"
          "$CHROME_REAL" --version
          sha256sum "$CHROME_REAL"
          echo "CHROME_BIN=$CHROME_REAL" >> "$GITHUB_ENV"
      - name: Bundle under 96 MiB heap, 220 MiB RSS, 25 seconds
        id: bundle
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node --max-old-space-size=32 evidence/graphics-loop/garment-quality-v1/shoulder-topology-v1/office-source-shell-v3/neck-complement-domain-audit-v1/integration-probe-v5/remote-ci-v5/run-bounded-linux.mjs build "$EXPECTED_SNAPSHOT_SHA256"
      - name: Run geometry/domain, float skin-weight, monitor-gate, browser-result contract, and CDP-exception tests under 96 MiB heap, 220 MiB RSS, 25 seconds
        id: synthetic
        if: always() && steps.bundle.outcome == 'success'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node --max-old-space-size=32 evidence/graphics-loop/garment-quality-v1/shoulder-topology-v1/office-source-shell-v3/neck-complement-domain-audit-v1/integration-probe-v5/remote-ci-v5/run-bounded-linux.mjs synthetic "$EXPECTED_SNAPSHOT_SHA256"
      - name: Capture matched body-material neck A/B under 2 GiB and 60 seconds
        if: always() && steps.bundle.outcome == 'success' && steps.synthetic.outcome == 'success'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node --max-old-space-size=32 evidence/graphics-loop/garment-quality-v1/shoulder-topology-v1/office-source-shell-v3/neck-complement-domain-audit-v1/integration-probe-v5/remote-ci-v5/run-bounded-linux.mjs browser "$EXPECTED_SNAPSHOT_SHA256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-neck-domain-audit-v5-${{ github.run_id }}
          path: evidence/graphics-loop/garment-quality-v1/shoulder-topology-v1/office-source-shell-v3/neck-complement-domain-audit-v1/integration-probe-v5/remote-ci-v5/remote-results/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
