name: Office patch exact pixel attribution
on:
  push:
    branches: [codex/graphics-office-pixel-attribution-v3]
permissions:
  contents: read
jobs:
  office-pixel-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Prepare pinned generated human source
        run: |
          python3 evidence/graphics-loop/authored-complete-body-v1/download-source.py
          python3 evidence/graphics-loop/authored-character-spike-v1/retain-morphs.py evidence/graphics-loop/authored-character-spike-v1/parametric-base.glb evidence/graphics-loop/authored-character-spike-v1/parametric-base-expressive.glb
          node --max-old-space-size=128 evidence/graphics-loop/authored-complete-body-v1/bake-authored-expressions.mjs
          node --max-old-space-size=128 evidence/graphics-loop/authored-complete-body-v1/authored-body-compression/compress-native-body.mjs
      - name: Verify pinned diagnostic inputs
        run: node evidence/graphics-loop/authored-complete-body-v1/native-full-runtime-v1/verify-office-pixel-attribution-pins-v2.mjs
      - name: Typecheck isolated exact-pixel fixture
        run: node --max-old-space-size=768 node_modules/typescript/bin/tsc --noEmit --pretty false -p evidence/graphics-loop/authored-complete-body-v1/native-full-runtime-v1/office-pixel-attribution-v2.typecheck.json
      - name: Bundle exact-pixel fixture
        if: always()
        run: node --max-old-space-size=128 evidence/graphics-loop/authored-complete-body-v1/native-full-runtime-v1/calf-component-toggle-v1/bundle-office-pixel-attribution.mjs
      - name: Render one exact source-index and garment-depth ray
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          python3 evidence/graphics-loop/authored-complete-body-v1/bounded-render.py /tmp/office-pixel-attribution-resources.log /tmp/office-pixel-attribution-resources.json node evidence/graphics-loop/authored-complete-body-v1/native-full-runtime-v1/calf-component-toggle-v1/render-office-pixel-attribution-v2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-pixel-attribution-v2-${{ github.run_id }}
          path: |
            evidence/graphics-loop/authored-complete-body-v1/native-full-runtime-v1/remote-results/office-pixel-attribution-v2-${{ github.run_id }}/
            /tmp/office-pixel-attribution-resources.log
            /tmp/office-pixel-attribution-resources.json
          if-no-files-found: error
