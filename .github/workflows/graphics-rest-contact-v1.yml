name: Native actual chair and stair source contacts
on:
  push:
    branches: [codex/graphics-complete-authored-body-v39]
permissions:
  contents: read
jobs:
  rest:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git fetch --depth=1 origin 3af17a01b8bd406bfb830ca0d2ee66d2d0093d28
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Prepare pinned complete body
        run: |
          python3 evidence/graphics-loop/authored-complete-body-v1/download-source.py
          python3 evidence/graphics-loop/authored-character-spike-v1/retain-morphs.py evidence/graphics-loop/authored-character-spike-v1/parametric-base.glb evidence/graphics-loop/authored-character-spike-v1/parametric-base-expressive.glb
          node --max-old-space-size=128 evidence/graphics-loop/authored-complete-body-v1/bake-authored-expressions.mjs
          node --max-old-space-size=128 evidence/graphics-loop/authored-complete-body-v1/authored-body-compression/compress-native-body.mjs
      - name: Strict actual factory types
        if: always()
        run: node --max-old-space-size=768 node_modules/typescript/bin/tsc --noEmit --pretty false -p evidence/graphics-loop/authored-complete-body-v1/native-full-runtime-v1/native-runtime.typecheck.json
      - name: Bundle actual prepared actor
        if: always()
        run: node --max-old-space-size=128 evidence/graphics-loop/authored-complete-body-v1/native-full-runtime-v1/bundle-prepared-factory.mjs
      - name: Verify actual production chair and staircase footprint
        if: always()
        run: node --max-old-space-size=160 --experimental-strip-types evidence/graphics-loop/authored-complete-body-v1/native-full-runtime-v1/native-gameplay-contact-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-stairs-${{ github.run_id }}
          path: |
            evidence/graphics-loop/authored-complete-body-v1/native-full-runtime-v1/native-gameplay-contact-check-result.json
            evidence/graphics-loop/authored-complete-body-v1/native-rest-contact-v1/actual-15-pose-result.json
            /tmp/rest-render-resources.*
          if-no-files-found: warn
