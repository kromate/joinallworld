name: Matched female office torso clothing mask A B
on:
  push:
    branches: [codex/graphics-torso-mask-ab-v3]
permissions:
  contents: read
jobs:
  torso:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Prepare pinned source assets
        run: |
          python3 evidence/graphics-loop/authored-complete-body-v1/download-source.py
          python3 evidence/graphics-loop/authored-character-spike-v1/retain-morphs.py evidence/graphics-loop/authored-character-spike-v1/parametric-base.glb evidence/graphics-loop/authored-character-spike-v1/parametric-base-expressive.glb
          node --max-old-space-size=128 evidence/graphics-loop/authored-complete-body-v1/bake-authored-expressions.mjs
          node --max-old-space-size=128 evidence/graphics-loop/authored-complete-body-v1/authored-body-compression/compress-native-body.mjs
      - name: Typecheck mask comparison fixture
        run: node --max-old-space-size=768 node_modules/typescript/bin/tsc --noEmit --pretty false -p evidence/graphics-loop/authored-complete-body-v1/native-full-runtime-v1/office-mask-ab.typecheck.json
      - name: Bundle mask comparison fixture
        if: always()
        run: node --max-old-space-size=128 evidence/graphics-loop/authored-complete-body-v1/native-full-runtime-v1/bundle-office-torso-mask-ab.mjs
      - name: Render matched existing and candidate clothed actor
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 evidence/graphics-loop/authored-complete-body-v1/bounded-render.py /tmp/office-mask-resources.log /tmp/office-mask-resources.json node evidence/graphics-loop/authored-complete-body-v1/native-full-runtime-v1/render-office-torso-mask-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: torso-mask-ab-${{ github.run_id }}
          path: |
            evidence/graphics-loop/authored-complete-body-v1/native-full-runtime-v1/remote-results/
            /tmp/office-mask-resources.*
          if-no-files-found: error
