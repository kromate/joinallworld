name: Exact current production native graphics graph preflight
on:
  push:
    branches: [codex/graphics-native-shared-hosts-v4]
permissions:
  contents: read
jobs:
  hosts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Typecheck actual player creator venue home graph
        run: npm run typecheck
      - name: Existing creator stand-in home queue and scene lifecycle regressions
        if: always()
        run: node --max-old-space-size=512 --experimental-strip-types --test --test-concurrency=1 src/scene/avatar-preview.test.ts src/scene/body/body-lifecycle.test.ts src/scene/body/gate.test.ts src/scene/body/stand-in.test.ts src/scene/home-crowd.test.ts src/scene/crowd.test.ts src/scene/crowd-native-appearance.test.ts src/scene/body/canonical-crowd.test.ts src/scene/kit-late-close.test.ts src/scene/body/native/native-expression-controller.test.ts src/venue-world.test.ts
  size:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Build exact staged native source
        run: npm run build -- --outDir /tmp/graphics-native-dist
      - name: Record existing candidate size gates without changing limits
        if: always()
        continue-on-error: true
        run: node --experimental-strip-types scripts/download-budget.ts --dist /tmp/graphics-native-dist --json > /tmp/graphics-native-budget.json
      - name: Build exact production baseline separately
        run: |
          git fetch --depth=1 origin c1f7c1f7369139ce559292318ba9842c23a28267
          git worktree add --detach /tmp/graphics-baseline c1f7c1f7369139ce559292318ba9842c23a28267
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/graphics-baseline/node_modules
          cd /tmp/graphics-baseline
          npm run build -- --outDir /tmp/graphics-baseline-dist
          node --experimental-strip-types scripts/download-budget.ts --dist /tmp/graphics-baseline-dist --json > /tmp/graphics-baseline-budget.json
      - name: Measure whole distribution and graphics assets
        run: node --max-old-space-size=128 evidence/graphics-loop/native-game-adoption-v1/measure-native-distribution.mjs > /tmp/graphics-distribution-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-distribution-${{ github.run_id }}
          path: |
            /tmp/graphics-native-budget.json
            /tmp/graphics-baseline-budget.json
            /tmp/graphics-distribution-comparison.json
