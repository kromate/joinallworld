name: World index audit diagnostic

on:
  push:
    branches: [codex/world-index-audit-diagnostic]

permissions:
  contents: read

concurrency:
  group: world-index-audit-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Record exact source and runtime paths
        run: |
          mkdir -p diagnostic-evidence
          printf 'WORLD_TEST_NODE=%s\n' "$(realpath "$(command -v node)")" >> "$GITHUB_ENV"
          printf 'WORLD_TEST_PYTHON=%s\n' "$(realpath "$(command -v python)")" >> "$GITHUB_ENV"
          git rev-parse HEAD > diagnostic-evidence/source-sha.txt
          node -p 'JSON.stringify(process.versions)' > diagnostic-evidence/node-runtime.json
          python -c 'import json,sqlite3,sys; print(json.dumps({"python":sys.version,"sqlite":sqlite3.sqlite_version}))' > diagnostic-evidence/python-runtime.json
      - name: Install locked TypeScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify six immutable raw copies and unchanged storage preflight
        id: preflight
        env:
          PYTHONPATH: world/tooling
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -c 'import json,pathlib; from test_index_ingest import retained_input_path; from index_tooling import FILES,FORMAT,source_snapshot_allowance; root=pathlib.Path.cwd(); fixture=json.loads((root/"world/campaign-fixtures/index-audit/manifest.json").read_bytes()); paths=[retained_input_path(item["original"]) for item in fixture["files"]]; manifest={"format":FORMAT,"files":{name:{"sha256":"a"*64,"bytes":(root/name).stat().st_size} for name in FILES}}; source=source_snapshot_allowance(manifest,(root/"world/acquisition-sources.json").stat().st_size); control=source+2*65536+2*8192+8192; assert control<=1048576; print(json.dumps({"files":len(paths),"bytes":sum(p.stat().st_size for p in paths),"sourceAllowance":source,"registryControlWithOperation":control}))' > diagnostic-evidence/preflight.json
      - name: Pure audit protocol and kernel
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          NODE_OPTIONS: --max-old-space-size=128
        run: node --experimental-strip-types --test --test-concurrency=1 world/feature-index-session.test.ts world/feature-index-audit.test.ts > diagnostic-evidence/node-audit.tap 2>&1
      - name: Actual audit controller and recovery
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          PYTHONPATH: world/tooling
          PYTHONDONTWRITEBYTECODE: '1'
        run: /usr/bin/time -v python -B -m unittest test_index_audit_controller > diagnostic-evidence/python-audit.stdout 2> diagnostic-evidence/python-audit.stderr
      - name: Actual held Python sessions and audit replay
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          PYTHONPATH: world/tooling
          PYTHONDONTWRITEBYTECODE: '1'
        run: /usr/bin/time -v python -B -m unittest test_index_capture_session > diagnostic-evidence/python-session.stdout 2> diagnostic-evidence/python-session.stderr
      - name: Actual Node to Python retained-capture audit and portable campaign fencing
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          NODE_OPTIONS: --max-old-space-size=128
        run: node --experimental-strip-types --test --test-concurrency=1 --test-name-pattern='actual Node to Python final audit|zero-row source capture indexes|stale campaign audit completion|a stale index completion|legacy source captures|subdivision excludes|changed capture bytes|status reports pending|source-derived shard plan|source-derived shards' world/campaign-feature-index.test.ts > diagnostic-evidence/sdk-audit.tap 2>&1
      - name: Affected registry, capture and ingestion regression checks
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          PYTHONPATH: world/tooling
          PYTHONDONTWRITEBYTECODE: '1'
        run: /usr/bin/time -v python -B -m unittest test_index_tooling test_index_capture_record test_index_storage_footprint test_index_registry_startup test_index_registry_controller test_index_admission test_index_capture_controller test_index_ingest test_index_shard_startup test_index_shard_admission_worker test_index_shard_controller test_index_shard_handoff test_index_shard_reopen test_campaign_inherited_lease > diagnostic-evidence/python-regression.stdout 2> diagnostic-evidence/python-regression.stderr
      - name: Remaining process, bootstrap, lease and recovery regression checks
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          PYTHONPATH: world/tooling
          PYTHONDONTWRITEBYTECODE: '1'
        run: /usr/bin/time -v python -B -m unittest test_index_process_boundary test_index_namespace test_index_resource_limits test_index_controller_record test_index_capture_loss test_index_writer_lock test_index_registry_restart test_index_binding test_index_capture_observation test_index_binding_publish test_index_registry_worker test_index_registry_persistent test_index_root test_index_reservations test_index_bootstrap test_index_execution_snapshot > diagnostic-evidence/python-boundary.stdout 2> diagnostic-evidence/python-boundary.stderr
      - name: Existing identity and index contracts plus draft audit job contract
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          NODE_OPTIONS: --max-old-space-size=128
        run: node --experimental-strip-types --test --test-concurrency=1 world/capture-binding.test.ts world/feature-identity.test.ts world/feature-index.test.ts world/campaign-index-audit-state.test.ts > diagnostic-evidence/node-contracts.tap 2>&1
      - name: Affected campaign and Ledger regression checks
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          NODE_OPTIONS: --max-old-space-size=128
        run: node --experimental-strip-types --test --test-concurrency=1 world/campaign.test.ts world/grid-query-campaign.test.ts world/ledger.test.ts world/ledger-subdivision.test.ts world/ledger-permanent.test.ts world/ledger-quota.test.ts > diagnostic-evidence/campaign-regression.tap 2>&1
      - name: Frozen namespace shard-plan codec
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          NODE_OPTIONS: --max-old-space-size=128
        run: node --experimental-strip-types --test --test-concurrency=1 world/index-shard-plan.test.ts world/index-shard-plan-python.test.ts world/index-shard-evidence.test.ts > diagnostic-evidence/shard-plan.tap 2>&1
      - name: Actual campaign lease inheritance and complete bounded windows
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          NODE_OPTIONS: --max-old-space-size=128
        run: node --experimental-strip-types --test --test-concurrency=1 world/campaign-lease.test.ts world/campaign-worker-leases.test.ts world/index-shard-window.test.ts > diagnostic-evidence/campaign-lease.tap 2>&1
      - name: Exact reviewed JavaScript and public-release source boundary
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          NODE_OPTIONS: --max-old-space-size=128
        run: node --experimental-strip-types --test --test-concurrency=1 server/release.test.ts > diagnostic-evidence/release-source.tap 2>&1
      - name: Exact checked-out release workflow policy
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          NODE_OPTIONS: --max-old-space-size=64
        run: node scripts/check-workflows.mjs > diagnostic-evidence/release-policy.stdout 2> diagnostic-evidence/release-policy.stderr
      - name: World TypeScript
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          NODE_OPTIONS: --max-old-space-size=384
        run: node_modules/.bin/tsc --noEmit -p world/tsconfig.json > diagnostic-evidence/world-typecheck.stdout 2> diagnostic-evidence/world-typecheck.stderr
      - name: Retain exact-source diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-index-audit-${{ github.sha }}
          path: diagnostic-evidence/
          retention-days: 7
          if-no-files-found: error

  macos-lease:
    needs: audit
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retain macOS source before runtime setup
        run: |
          mkdir -p diagnostic-evidence
          git rev-parse HEAD > diagnostic-evidence/source-sha.txt
          uname -sm > diagnostic-evidence/runner-platform.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Record exact macOS source and runtimes
        id: runtimes
        run: |
          python -c 'import hashlib,json,os,pathlib,stat,sys; p=pathlib.Path(sys.executable).resolve(strict=True); s=p.lstat(); print(json.dumps({"path":str(p),"uid":s.st_uid,"gid":s.st_gid,"runnerUid":os.getuid(),"mode":oct(stat.S_IMODE(s.st_mode)),"links":s.st_nlink,"bytes":s.st_size,"device":s.st_dev,"inode":s.st_ino,"sha256":hashlib.file_digest(p.open("rb"),"sha256").hexdigest()}))' > diagnostic-evidence/python-installed-file-identity.json
          printf 'WORLD_TEST_NODE=%s\n' "$(node -p 'require("node:fs").realpathSync(process.execPath)')" >> "$GITHUB_ENV"
          test ! -e "$RUNNER_TEMP/world-lease-python"
          python -m venv --copies --without-pip "$RUNNER_TEMP/world-lease-python"
          printf 'WORLD_TEST_PYTHON=%s\n' "$("$RUNNER_TEMP/world-lease-python/bin/python" -c 'import os,sys; print(os.path.realpath(sys.executable))')" >> "$GITHUB_ENV"
          node -p 'JSON.stringify(process.versions)' > diagnostic-evidence/node-runtime.json
          "$RUNNER_TEMP/world-lease-python/bin/python" -c 'import json,platform,sys; print(json.dumps({"python":sys.version,"platform":platform.platform(),"prefix":sys.prefix,"basePrefix":sys.base_prefix}))' > diagnostic-evidence/python-runtime.json
          "$RUNNER_TEMP/world-lease-python/bin/python" -c 'import hashlib,json,os,pathlib,stat,sys; p=pathlib.Path(sys.executable).resolve(strict=True); s=p.lstat(); assert s.st_uid==os.getuid() and s.st_nlink==1 and stat.S_IMODE(s.st_mode)==0o755; print(json.dumps({"path":str(p),"uid":s.st_uid,"gid":s.st_gid,"runnerUid":os.getuid(),"mode":oct(stat.S_IMODE(s.st_mode)),"links":s.st_nlink,"bytes":s.st_size,"device":s.st_dev,"inode":s.st_ino,"sha256":hashlib.file_digest(p.open("rb"),"sha256").hexdigest()}))' > diagnostic-evidence/python-file-identity.json
      - name: Actual macOS inherited flock helper
        env:
          PYTHONPATH: world/tooling
          PYTHONDONTWRITEBYTECODE: '1'
        run: '"$WORLD_TEST_PYTHON" -B -m unittest test_campaign_inherited_lease > diagnostic-evidence/python-lease.stdout 2> diagnostic-evidence/python-lease.stderr'
      - name: Actual macOS Node coordinator and surviving worker
        if: ${{ !cancelled() && steps.runtimes.outcome == 'success' }}
        env:
          NODE_OPTIONS: --max-old-space-size=128
        run: node --experimental-strip-types --test --test-concurrency=1 world/campaign-lease.test.ts world/campaign-worker-leases.test.ts > diagnostic-evidence/campaign-lease.tap 2>&1
      - name: Retain actual macOS anonymous-pipe identities
        if: ${{ !cancelled() && steps.runtimes.outcome == 'success' }}
        run: |
          "$WORLD_TEST_PYTHON" -c 'import fcntl,json,os,stat; fds=os.pipe(); [os.set_blocking(fd,False) for fd in fds]; print(json.dumps([{"fd":fd,"device":os.fstat(fd).st_dev,"inode":os.fstat(fd).st_ino,"uid":os.fstat(fd).st_uid,"gid":os.fstat(fd).st_gid,"mode":oct(stat.S_IMODE(os.fstat(fd).st_mode)),"links":os.fstat(fd).st_nlink,"fifo":stat.S_ISFIFO(os.fstat(fd).st_mode),"flags":fcntl.fcntl(fd,fcntl.F_GETFL)} for fd in fds])); [os.close(fd) for fd in fds]' > diagnostic-evidence/anonymous-pipe-identities.json
      - name: Actual macOS terminal shard verification without another attempt
        if: ${{ !cancelled() && steps.runtimes.outcome == 'success' }}
        env:
          PYTHONPATH: world/tooling
          PYTHONDONTWRITEBYTECODE: '1'
        run: '"$WORLD_TEST_PYTHON" -B -m unittest test_index_shard_reopen > diagnostic-evidence/python-reopen.stdout 2> diagnostic-evidence/python-reopen.stderr'
      - name: Retain exact macOS lease diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-campaign-lease-macos-${{ github.sha }}
          path: diagnostic-evidence/
          retention-days: 7
          if-no-files-found: error
