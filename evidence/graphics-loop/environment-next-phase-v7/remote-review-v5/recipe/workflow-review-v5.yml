name: Environment v7 actual-host diagnostic review v5
on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Exact successful v7 CPU package workflow run ID
        required: true
        type: string
      package_commit:
        description: Exact v7 package source commit SHA
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: environment-v7-render-review-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  render:
    name: ${{ matrix.scope }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scope: [scene-pair-home-neighbourhood, scene-pair-market-beach, lifecycle-only]
    steps:
      - name: Checkout exact render-recipe branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify staged workflow and recipe pins
        run: |
          cmp evidence/graphics-loop/environment-next-phase-v7/remote-review-v5/recipe/workflow-review-v5.yml .github/workflows/graphics-environment-next-phase-v7-render-review-v5.yml
          test -f evidence/graphics-loop/environment-next-phase-v7/remote-review-v5/recipe/review-sources-v5.json
      - name: Set up Node 22 for CDP and locked ws dependency
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact render-branch dependencies
        run: npm ci --no-audit --no-fund
      - name: Download the exact successful v7 CPU package artifact
        uses: actions/download-artifact@v4
        with:
          name: environment-whole-slice-v7-package-v3-${{ inputs.package_run_id }}
          run-id: ${{ inputs.package_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: evidence/graphics-loop/environment-next-phase-v7/remote-review-v5/recipe/package-input
      - name: Record runner Chrome identity
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          CHROME_REAL="$(readlink -f "$CHROME_PATH")"
          "$CHROME_REAL" --version
          sha256sum "$CHROME_REAL"
          echo "CHROME_BIN=$CHROME_REAL" >> "$GITHUB_ENV"
      - name: Run one bounded reviewed scope
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          REVIEW_SCOPE: ${{ matrix.scope }}
          PINNED_PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
          PINNED_PACKAGE_COMMIT: ${{ inputs.package_commit }}
        run: >-
          python3 evidence/graphics-loop/environment-next-phase-v7/remote-review-v5/recipe/run-bounded-linux-render-v5.py
          browser $(sha256sum evidence/graphics-loop/environment-next-phase-v7/remote-review-v5/recipe/review-sources-v5.json | cut -d' ' -f1)
          ${{ inputs.package_run_id }} ${{ inputs.package_commit }} ${{ matrix.scope }}
      - name: Upload per-scope diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-v7-render-review-v5-${{ github.run_id }}-${{ matrix.scope }}
          path: evidence/graphics-loop/environment-next-phase-v7/remote-review-v5/recipe/remote-results/${{ github.run_id }}-${{ matrix.scope }}/
          if-no-files-found: warn
          retention-days: 14
