<!doctype html><html><meta name="viewport" content="width=device-width, initial-scale=1"><title>Synthetic audio transport test</title><style>body{font:16px system-ui;background:#eef3ed;margin:20px}main{max-width:700px;margin:auto}pre{white-space:pre-wrap}</style><main><h1>Synthetic audio transport test</h1><p>Development fixture. No microphone is used. Join sends a quiet generated tone only after explicit unmute. Production capture remains unchanged.</p><div id="test-community"></div></main><script type="module">
import {createCommunity} from '/src/community.js';
const contexts=[];
const community=await createCommunity(document.querySelector('#test-community'),{diagnostics:true,audioStreamFactory:async()=>{const context=new AudioContext();contexts.push(context);await context.resume();const oscillator=context.createOscillator(),gain=context.createGain(),destination=context.createMediaStreamDestination();oscillator.frequency.value=440;gain.gain.value=0.05;oscillator.connect(gain);gain.connect(destination);oscillator.start();const track=destination.stream.getAudioTracks()[0],stop=track.stop.bind(track);track.stop=()=>{stop();oscillator.stop();context.close()};return destination.stream;}});
window.addEventListener('pagehide',()=>{community.destroy();contexts.forEach(c=>{if(c.state!=='closed')c.close()})});
</script></html>
