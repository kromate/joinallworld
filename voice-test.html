<!doctype html><html><meta name="viewport" content="width=device-width, initial-scale=1"><title>Synthetic audio transport test</title><style>body{font:16px system-ui;background:#eef3ed;margin:20px}main{max-width:700px;margin:auto}pre{white-space:pre-wrap}</style><main><h1>Synthetic audio transport test</h1><p>Development fixture. No microphone is used. Join sends a quiet generated tone only after explicit unmute. Production capture remains unchanged.</p><button id="deny-once">Simulate one capture denial</button><p id="fixture-status"></p><pre id="fixture-source" aria-label="Synthetic source diagnostics"></pre><div id="test-community"></div></main><script type="module">
import {createCommunity} from '/src/community.js';
const sources=[];let denyOnce=false;
document.querySelector('#deny-once').onclick=()=>{denyOnce=true;document.querySelector('#fixture-status').textContent='Next test capture will reject with NotAllowedError. This simulates denial without requesting a microphone.'};
const community=await createCommunity(document.querySelector('#test-community'),{
 diagnostics:true,
 onPeerStats:()=>{document.querySelector('#fixture-source').textContent=JSON.stringify(sources.map(({context,analyser,track,samples})=>{analyser.getFloatTimeDomainData(samples);return {contextState:context.state,currentTime:context.currentTime,trackEnabled:track.enabled,trackState:track.readyState,sourceRms:Math.sqrt(samples.reduce((n,v)=>n+v*v,0)/samples.length)}}),null,2)},
 audioStreamFactory:async()=>{
  if(denyOnce){denyOnce=false;throw new DOMException('Synthetic capture denied','NotAllowedError')}
  const context=new AudioContext();await context.resume();
  const oscillator=context.createOscillator(),gain=context.createGain(),destination=context.createMediaStreamDestination(),analyser=context.createAnalyser();
  oscillator.frequency.value=440;gain.gain.value=0.05;oscillator.connect(gain);gain.connect(destination);gain.connect(analyser);oscillator.start();
  const track=destination.stream.getAudioTracks()[0],stop=track.stop.bind(track);
  sources.push({context,analyser,track,samples:new Float32Array(analyser.fftSize)});
  track.stop=()=>{stop();oscillator.stop();context.close()};return destination.stream;
 }
});
window.addEventListener('pagehide',()=>{community.destroy();sources.forEach(({context})=>{if(context.state!=='closed')context.close()})});
</script></html>
